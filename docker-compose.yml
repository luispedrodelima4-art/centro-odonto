services:
  postgres:
    image: postgres:16-alpine
    container_name: centro_odonto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secret_pass}
      POSTGRES_DB: ${DB_NAME:-centro_odonto_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-centro_odonto_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - centro_odonto_network

  redis:
    image: redis:7-alpine
    container_name: centro_odonto_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - centro_odonto_network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: centro_odonto_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - centro_odonto_network

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: centro_odonto_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-miniopassword123};
      /usr/bin/mc mb --ignore-existing local/clinical-records;
      /usr/bin/mc mb --ignore-existing local/diagnostic-images;
      /usr/bin/mc anonymous set download local/clinical-records;
      exit 0;
      "
    networks:
      - centro_odonto_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: centro_odonto_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secret_pass}@postgres:5432/${DB_NAME:-centro_odonto_db}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword123}
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_centro_odonto_2026}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - centro_odonto_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: centro_odonto_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3333}/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - centro_odonto_network

networks:
  centro_odonto_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_node_modules:
  frontend_node_modules:
